<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a404c"/>
      <stop offset="1" stop-color="#1b1e24"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/>
      <stop offset="1" stop-color="#c9ced8"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px body inside the 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <!-- outline bubble; the tail is a hard diagonal, a nod to the slash in Zed's mark -->
  <path d="M 362 300 H 662 A 82 82 0 0 1 744 382 V 560 A 82 82 0 0 1 662 642 H 470 L 318 768 L 352 642 A 82 82 0 0 1 280 560 V 382 A 82 82 0 0 1 362 300 Z"
        fill="none" stroke="url(#ink)" stroke-width="58" stroke-linejoin="round"/>
  <!-- two lines of text; the reply in the accent colour -->
  <rect x="384" y="420" width="256" height="50" rx="25" fill="url(#ink)"/>
  <rect x="384" y="508" width="168" height="50" rx="25" fill="#61afef"/>
</svg>

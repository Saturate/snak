[package]
name = "snak-app"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "GPL-3.0-or-later"

[[bin]]
name = "snak"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
snak-mcp = { path = "../snak-mcp" }
# Grammars for highlighting code blocks in messages; the common chat languages
# rather than all of them, since each one adds to the binary.
gpui-kit = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snak-chat = { path = "../snak-chat" }
snak-demo = { path = "../snak-demo" }
snak-teams = { path = "../snak-teams" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }

[dev-dependencies]
serde_json = "1"

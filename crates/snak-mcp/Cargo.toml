[package]
name = "snak-mcp"
description = "The snak MCP server over stdio, sharing the app's stored Teams session."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "GPL-3.0-or-later"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snak-chat = { path = "../snak-chat" }
snak-teams = { path = "../snak-teams" }
tokio = { version = "1", features = ["rt-multi-thread"] }

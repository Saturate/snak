[package]
name = "snak-teams"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish = false
license = "MPL-2.0"

[dependencies]
chrono = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
html-escape = "0.2"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snak-chat = { path = "../snak-chat" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
